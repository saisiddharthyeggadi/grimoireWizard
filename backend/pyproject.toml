[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "grimoire-wizard-backend"
version = "0.1.0"
description = "PDF ingestion and conversation API for Grimoire Wizard"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "openai>=1.50",
    "pymupdf4llm>=0.0.17",
    "python-multipart>=0.0.9",
    "sentence-transformers>=3.0",
    "supabase>=2.0",
    "python-dotenv>=1.0",
    "rapidocr>=3.10.0",
    "uvicorn[standard]>=0.30",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
grimoire-ingest = "grimoire_ingest.cli:main"
grimoire-api = "grimoire_api.main:run"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
