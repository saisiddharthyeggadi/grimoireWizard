[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "grimoire-wizard-ingest"
version = "0.1.0"
description = "English PDF ingestion into Supabase pgvector"
requires-python = ">=3.11"
dependencies = [
    "pymupdf4llm>=0.0.17",
    "sentence-transformers>=3.0",
    "supabase>=2.0",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
grimoire-ingest = "grimoire_ingest.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
